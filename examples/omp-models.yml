# oh-my-pi custom providers — Neuralwatt via API (FULL free catalog)
#
#   neuralwatt-free  -> the local shim (http://127.0.0.1:8787/v1) serving
#                       Neuralwatt's anonymous tier: no key, no account,
#                       quota-keyed per egress IP; UA presented as opencode
#                       (NW_UA env). maxTokens 1024 = free-tier clamp.
#                       Start: python3 /root/nw-free/nw_free_shim.py
#
#   neuralwatt       -> the paid OpenAI-compatible API (NEURALWATT_API_KEY
#                       in env or ~/.omp/agent/.env). Same 19-model catalog.
#                       Swap a role: omp config set modelRoles.default neuralwatt/<id>
#
# All 19 playground/API models. The raw id 'deepseek-ai/DeepSeek-V4-Flash'
# is covered by the plain 'deepseek-v4-flash' entry (same model).
# cost figures are advisory per MTok (paid tier only; free = 0).
